<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejes de Cuadrante F-V</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 2rem 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container flex flex-col items-center">
        <h1 class="text-xl font-bold text-gray-800 mb-8 text-center">Ejes del Cuadrante F-V</h1>
        
        <svg width="350" height="350" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            
            <circle cx="20" cy="380" r="5" fill="#4b5563"/>

            <line x1="20" y1="380" x2="20" y2="20" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
            <path d="M20 20 L28 35 L12 35 L20 20 Z" fill="#1d4ed8"/>
            
            <text x="50" y="200" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 50 200)">
                FUERZA
            </text>
            
            <line x1="20" y1="380" x2="380" y2="380" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
            <path d="M380 380 L365 372 L365 388 L380 380 Z" fill="#dc2626"/>

            <text x="200" y="360" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">
                VELOCIDAD
            </text>

            <text x="20" y="395" font-family="Inter, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
                0
            </text>
            <text x="20" y="10" font-family="Inter, sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
                Alta F
            </text>
            <text x="390" y="395" font-family="Inter, sans-serif" font-size="14" fill="#4b5563" text-anchor="end">
                Alta V
            </text>
        </svg>

        <p class="mt-8 text-sm text-gray-500">
            Ejes para el análisis Fuerza-Velocidad (Fuerza en Y, Velocidad en X).
        </p>
    </div>
</body>
</html>
